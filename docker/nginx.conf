# Cache-Control đặt 1 lần ở cấp server (add_header trong location sẽ làm mất security headers
# và bị lặp với "expires"). Giá trị rỗng → nginx không gửi header.
map $uri $static_cache_control {
    /env-config.js                                                   "no-store";
    ~*\.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$    "public, max-age=31536000, immutable";
    default                                                          "";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Sau proxy HTTPS của EasyPanel: Location tương đối để 301 không trỏ về http://…:80
    absolute_redirect off;

    # ── URL cũ của website hiện tại (.html) → URL mới (301 vĩnh viễn, giữ query string) ──
    # Danh sách sinh từ src/configs/legacyPaths.ts. KHÔNG xoá: đây là thứ giữ lại thứ hạng và
    # backlink mà website cũ đang có. Bài ngành tạm trỏ về /nganh-dao-tao cho tới khi import xong.
    rewrite ^/trang-chu\.html$ / permanent;
    rewrite ^/gioi-thieu\.html$ /gioi-thieu permanent;
    rewrite ^/chuong-trinh-dao-tao\.html$ /nganh-dao-tao permanent;
    rewrite ^/du-hoc\.html$ /du-hoc permanent;
    rewrite ^/tra-cuu-van-bang\.html$ /tra-cuu-van-bang permanent;
    rewrite ^/tin-tuc\.html$ /tin-tuc permanent;
    rewrite ^/lien-he\.html$ /lien-he permanent;
    rewrite ^/hinh-anh\.html$ /hinh-anh permanent;
    rewrite ^/bao-mat-thong-tin\.html$ /chinh-sach-bao-mat permanent;
    rewrite ^/chinh-sach-hoc-vien\.html$ /chinh-sach-bao-mat permanent;
    rewrite ^/huong-dan-thanh-toan\.html$ /tuyen-sinh permanent;
    rewrite ^/dang-ky-tuyen-sinh\.html$ /tuyen-sinh permanent;
    rewrite ^/chuyen-nganh-dieu-duong-he-trung-cap-\.html$ /nganh-dao-tao/chuyen-nganh-dieu-duong-he-trung-cap permanent;
    rewrite ^/tuyen-sinh-nganh-duoc-si-he-trunng-cap-khai-giang-ngay-16-03-2026-\.html$ /nganh-dao-tao/tuyen-sinh-nganh-duoc-si-he-trung-cap-khai-giang-ngay-16-03-2026 permanent;
    rewrite ^/cham-soc-nguoi-cao-tuoi-\.html$ /nganh-dao-tao/cham-soc-nguoi-cao-tuoi permanent;
    rewrite ^/tuyen-sinh-khoa-32-nghiep-vu-tro-ly-nha-khoa-khai-giang-ngay-01-07-2026\.html$ /nganh-dao-tao/tuyen-sinh-khoa-32-nghiep-vu-tro-ly-nha-khoa-khai-giang-ngay-01-07-2026 permanent;
    rewrite ^/cham-soc-sac-dep-he-trung-cap-\.html$ /nganh-dao-tao/cham-soc-sac-dep-he-trung-cap permanent;
    rewrite ^/tuyen-sinh-nganh-beauty-therapy-lieu-phap-lam-dep-\.html$ /nganh-dao-tao/tuyen-sinh-nganh-beauty-therapy-lieu-phap-lam-dep permanent;
    rewrite ^/cham-soc-da-chuyen-nghiep-\.html$ /nganh-dao-tao/cham-soc-da-chuyen-nghiep permanent;
    rewrite ^/cham-soc-nails-chuyen-nghiep-ngan-han-\.html$ /nganh-dao-tao/cham-soc-nails-chuyen-nghiep-ngan-han permanent;
    rewrite ^/ky-thuat-che-bien-mon-an-\.html$ /nganh-dao-tao/ky-thuat-che-bien-mon-an permanent;
    rewrite ^/khai-giang-ky-thuat-lam-banh-khoa-106-he-trung-cap-\.html$ /nganh-dao-tao/khai-giang-ky-thuat-lam-banh-khoa-106-he-trung-cap permanent;
    rewrite ^/quan-tri-khach-san-\.html$ /nganh-dao-tao/quan-tri-khach-san permanent;
    rewrite ^/khai-giang-nghiep-vu-le-tan-\.html$ /nganh-dao-tao/khai-giang-nghiep-vu-le-tan permanent;
    rewrite ^/nghiep-vu-pha-che\.html$ /nganh-dao-tao/nghiep-vu-pha-che permanent;
    rewrite ^/trung-cap-ky-thuat-xay-dung-\.html$ /nganh-dao-tao/trung-cap-ky-thuat-xay-dung permanent;
    rewrite ^/tuyen-sinh-cong-nghe-ky-thuat-o-to-khai-giang-ngay-03-03-2026\.html$ /nganh-dao-tao/tuyen-sinh-cong-nghe-ky-thuat-o-to-khai-giang-ngay-03-03-2026 permanent;
    rewrite ^/thong-bao-tuyen-sinh-nganh-thiet-ke-noi-that-khoa-17-\.html$ /nganh-dao-tao/thong-bao-tuyen-sinh-nganh-thiet-ke-noi-that-khoa-17 permanent;
    rewrite ^/tuyen-sinh-ky-thuat-moc-xay-dung-va-trang-tri-noi-that-\.html$ /nganh-dao-tao/tuyen-sinh-ky-thuat-moc-xay-dung-va-trang-tri-noi-that permanent;
    rewrite ^/tuyen-sinh-thang-09-nghe-moc-noi-that-va-trang-tri-\.html$ /nganh-dao-tao/tuyen-sinh-thang-09-nghe-moc-noi-that-va-trang-tri permanent;
    rewrite ^/ke-toan-doanh-nghiep-\.html$ /nganh-dao-tao/ke-toan-doanh-nghiep permanent;
    rewrite ^/tuyen-sinh-trung-cap-nganh-quan-tri-kinh-doanh-\.html$ /nganh-dao-tao/tuyen-sinh-trung-cap-nganh-quan-tri-kinh-doanh permanent;
    rewrite ^/nganh-cong-nghe-thong-tin-he-trung-cap-\.html$ /nganh-dao-tao/nganh-cong-nghe-thong-tin-he-trung-cap permanent;
    rewrite ^/ngon-ngu-han-quoc\.html$ /nganh-dao-tao/ngon-ngu-han-quoc permanent;
    rewrite ^/nghiep-vu-bao-mau\.html$ /nganh-dao-tao/nghiep-vu-bao-mau permanent;
    rewrite ^/nghiep-vu-nghe-nong-nghiep-he-so-cap-\.html$ /nganh-dao-tao/nghiep-vu-nghe-nong-nghiep-he-so-cap permanent;
    rewrite ^/tuyen-sinh-he-dai-hoc-nam-2025\.html$ /nganh-dao-tao/tuyen-sinh-he-dai-hoc-nam-2025 permanent;
    rewrite ^/tuyen-sinh-he-lien-thong-dai-hoc-nganh-quan-tri-dich-vu-an-uong-va-am-thuc-\.html$ /nganh-dao-tao/tuyen-sinh-he-lien-thong-dai-hoc-nganh-quan-tri-dich-vu-an-uong-va-am-thuc permanent;
    rewrite ^/tuyen-sinh-lien-thong-he-dai-hoc-nganh-quan-tri-dich-vu-du-lich-lu-hanh-\.html$ /nganh-dao-tao permanent;
    # ── Bài tin cũ có slug ĐÃ ĐỔI khi import (site trường để dấu gạch ở đầu/cuối slug) ──
    # Thiếu các dòng này thì quy tắc chung bên dưới đẩy URL cũ sang /tin-tuc/<slug cũ> → 404.
    # Đối chiếu sitemap.xml của trường 09/10/2026, khớp từng bài theo tiêu đề + ngày đăng.
    rewrite ^/-khep-lai-thanh-cong-le-trao-bang-tot-nghiep-trao-hoc-bong-ngay-05-05-2026\.html$ /tin-tuc/khep-lai-thanh-cong-le-trao-bang-tot-nghiep-2026-va-trao-hoc-bong permanent;
    rewrite ^/hoat-dong-hien-mau-\.html$ /tin-tuc/hien-mau-hom-nay-trao-hy-vong-ngay-mai permanent;
    rewrite ^/le-ban-giao-xe-vinfast-8-cho-nganh-ky-thuat-sua-chua-o-to-\.html$ /tin-tuc/le-ban-giao-xe-vinfast-8-cho-nganh-ky-thuat-sua-chua-o-to permanent;
    rewrite ^/tuyen-dung-nhan-vien-phuc-vu-nha-hang-\.html$ /tin-tuc/tuyen-dung-nhan-vien-phuc-vu-nha-hang permanent;
    rewrite ^/co-hoi-thuc-tap-tai-sheraton-\.html$ /tin-tuc/co-hoi-thuc-tap-tai-sheraton permanent;
    rewrite ^/tuyen-dung-nganh-f-b-\.html$ /tin-tuc/tuyen-dung-nganh-f-b permanent;
    rewrite ^/thong-bao-nhan-bang-tot-nghiep-\.html$ /tin-tuc/thong-bao-nhan-bang-tot-nghiep permanent;

    # ── Trang rác của template cũ (bán hồ tiêu, quế, giỏ hàng) → 301 về trang chủ ──
    # Đang nằm trong sitemap.xml của trường nên Google đã index. Không để quy tắc chung đẩy sang
    # /tin-tuc/<slug> rồi 404: 301 trỏ vào 404 là tín hiệu xấu.
    # Dùng `rewrite` chứ không dùng `location`: nginx chạy hết rewrite ở mức server TRƯỚC khi chọn
    # location, nên `location = /...` đặt ở đây sẽ không bao giờ khớp.
    rewrite ^/(gio-hang|san-pham|video-home)\.html$ / permanent;
    rewrite ^/(star-anise-684|ground-black-pepper-575|white-pepper-119|black-papper)\.html$ / permanent;
    rewrite ^/(tube-cinnamon|broken-cinnamon|cinnamon-sticks|cinnamon-harvest|pepper-harvest)\.html$ / permanent;

    # Bài viết cũ còn lại dạng /<slug>.html → trang tin tương ứng (slug giữ nguyên khi import)
    rewrite ^/([a-z0-9-]+)\.html$ /tin-tuc/$1 permanent;

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    # X-XSS-Protection đã bỏ ở trình duyệt hiện đại (có thể gây lỗi) → tắt hẳn theo khuyến nghị OWASP
    add_header X-XSS-Protection "0" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # Site chạy sau HTTPS của EasyPanel; không includeSubDomains để không ảnh hưởng subdomain khác
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control $static_cache_control;

    # ── Cache: env-config.js KHÔNG cache (header từ map ở trên) ─────────────
    location = /env-config.js {
    }

    # ── Cache: static assets (JS/CSS/images có hash) cache lâu (header từ map) ─
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        access_log off;
    }

    # ── Trang HTML (đã tạo sẵn meta SEO bởi sitemap-server) ─────────────────
    # expires thay vì add_header → giữ security headers cấp server
    location / {
        expires -1;
        try_files $uri $uri/index.html =404;
    }

    # Trang chi tiết chưa tạo HTML (bài mới, chưa refresh) → vẫn chạy SPA, không 404.
    # Dùng spa.html (template không meta), KHÔNG dùng index.html vì đó là trang chủ
    # đã chèn canonical "/" → bot sẽ coi bài mới là bản sao trang chủ.
    location ~ ^/(nganh-dao-tao|tin-tuc)/[^/]+/?$ {
        expires -1;
        try_files $uri $uri/index.html /spa.html;
    }

    location = /spa.html {
        internal;
        expires -1;
        try_files /spa.html /index.html;
    }

    # URL không tồn tại → HTTP 404 thật, nội dung là app (404.html có noindex)
    error_page 404 /404.html;
    location = /404.html {
        internal;
        expires -1;
        try_files /404.html /spa.html;
    }

    # ── Tạo lại sitemap + HTML SEO: proxy sang server nội bộ (scripts/sitemap-server.js)
    location = /sitemap/refresh {
        access_log off;
        proxy_pass http://127.0.0.1:3100;
        proxy_read_timeout 120s;
    }

    # ── sitemap.xml thay đổi lúc runtime → không cache lâu ───────────────────
    location = /sitemap.xml {
        expires -1;
    }

    # ── Health check endpoint ─────────────────────────────────────────────────
    location = /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}
