    <!-- Đo lường: GA4 (số liệu, phễu) + Microsoft Clarity (bản đồ nhiệt, xem lại phiên) -->
    <script>
      // KHÔNG tải script nào, và KHÔNG tạo sẵn window.gtag / window.clarity ở đây.
      // Luật 91/2025: im lặng không phải là đồng ý. Nếu tạo sẵn hàng đợi lệnh thì mọi thao tác
      // TRƯỚC khi đồng ý vẫn bị dồn vào dataLayer, rồi gửi hết đi ngay lúc người dùng bấm "Đồng ý"
      // — tức là đo cả quãng chưa được phép. Vì vậy hàng đợi chỉ được dựng bên trong hàm nạp.
      // Trước khi đồng ý: window.gtag và window.clarity đều undefined, src/utils/analytics.js tự im.
      (function () {
        var loaded = false;
        function addScript(src) {
          var s = document.createElement("script");
          s.async = true;
          s.src = src;
          document.head.appendChild(s);
        }
        // Chỉ được gọi từ src/components/CookieConsent.jsx sau khi người dùng bấm "Đồng ý".
        // options.sessionRecording = false → chỉ bật GA4, không bật Clarity
        // (xem NO_SESSION_RECORDING_PATHS trong src/utils/consent.js)
        window.__nlqtLoadAnalytics = function (options) {
          if (loaded) return;
          loaded = true;
          window.dataLayer = window.dataLayer || [];
          window.gtag = function () {
            window.dataLayer.push(arguments);
          };
          window.gtag("js", new Date());
          window.gtag("config", "G-1J20C6MJPZ", { anonymize_ip: true });
          addScript("https://www.googletagmanager.com/gtag/js?id=G-1J20C6MJPZ");
          if (options && options.sessionRecording) {
            window.clarity =
              window.clarity ||
              function () {
                (window.clarity.q = window.clarity.q || []).push(arguments);
              };
            addScript("https://www.clarity.ms/tag/yuly13i8pk");
          }
        };
      })();
    </script>
